<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Agent</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;background:var(--bg,#fff);color:#111}
  #log{white-space:pre-wrap;line-height:1.6}
  .msg{margin:12px 0;padding:10px 12px;border-radius:10px;background:#f2f2f2}
  .user{background:#e8f0fe}
  .tool{font-size:12px;color:#666;background:#fafafa}
  #bar{display:flex;gap:8px;position:sticky;bottom:0;background:inherit;padding:10px 0}
  input{flex:1;padding:10px;font-size:16px}
  button{padding:10px 16px;font-size:16px}
  @media (prefers-color-scheme:dark){body{background:#111;color:#eee}.msg{background:#222}.user{background:#1b2a4a}}
</style>
</head>
<body>
<h2>我的 Agent</h2>
<div id="log"></div>
<div id="bar"><input id="in" placeholder="让它在服务器上干点什么…" autofocus><button id="send">发送</button></div>
<script>
const log = document.getElementById('log'), input = document.getElementById('in');
let history = [];
function add(text, cls){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; log.appendChild(d); window.scrollTo(0,document.body.scrollHeight); }
async function send(){
  const text = input.value.trim(); if(!text) return; input.value='';
  add(text,'user');
  let token = localStorage.getItem('access_token')||'';
  let res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-access-token':token},body:JSON.stringify({message:text,history})});
  if(res.status===401){ token = prompt('服务器设置了 ACCESS_TOKEN，请输入：')||''; localStorage.setItem('access_token',token);
    res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-access-token':token},body:JSON.stringify({message:text,history})}); }
  const data = await res.json();
  if(!res.ok){ add('出错：'+(data.detail||res.status),''); return; }
  (data.tool_log||[]).forEach(t=>add('🔧 '+t.tool+' '+JSON.stringify(t.args),'tool'));
  add(data.reply,'');
  history.push({role:'user',content:text},{role:'assistant',content:data.reply});
}
document.getElementById('send').onclick = send;
input.onkeydown = e=>{ if(e.key==='Enter') send(); };
</script>
</body>
</html>

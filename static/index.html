<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Agent</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;background:var(--bg,#fff);color:#111}
  #log{white-space:pre-wrap;line-height:1.6}
  .msg{margin:12px 0;padding:10px 12px;border-radius:10px;background:#f2f2f2}
  .user{background:#e8f0fe}
  .tool{font-size:12px;color:#666;background:#fafafa}
  .approval{border:2px solid #e6a700;background:#fff8e1}
  .approval button{margin:6px 8px 0 0}
  #bar{display:flex;gap:8px;position:sticky;bottom:0;background:inherit;padding:10px 0}
  input{flex:1;padding:10px;font-size:16px}
  button{padding:10px 16px;font-size:16px}
  @media (prefers-color-scheme:dark){body{background:#111;color:#eee}.msg{background:#222}.user{background:#1b2a4a}}
</style>
</head>
<body>
<h2>我的 Agent</h2>
<div id="log"></div>
<div id="bar"><input id="in" placeholder="让它在服务器上干点什么…" autofocus><button id="send">发送</button></div>
<script>
const log = document.getElementById('log'), input = document.getElementById('in');
let history = [];
let sessionId = localStorage.getItem('session_id') || '';
function add(text, cls){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; log.appendChild(d); window.scrollTo(0,document.body.scrollHeight); }
// v0.5 审批卡：中风险工具调用先停住等用户点卡，点通过只放行这一次，
// 5 分钟不点按拒绝处理。参数用 textContent 填，避免模型拼出的参数
// 里带 HTML 被当成代码执行。
function showApproval(ev){
  const card=document.createElement('div'); card.className='msg approval';
  const title=document.createElement('div'); title.textContent='⚠️ 需要确认：'+ev.tool+'（'+ev.reason+'）'; card.appendChild(title);
  const args=document.createElement('div'); args.className='tool'; args.textContent=JSON.stringify(ev.args); card.appendChild(args);
  const ok=document.createElement('button'); ok.textContent='通过';
  const no=document.createElement('button'); no.textContent='拒绝';
  const decide=async d=>{ ok.disabled=true; no.disabled=true;
    const token=localStorage.getItem('access_token')||'';
    const res=await fetch('/api/approvals/'+encodeURIComponent(ev.approval_id),{method:'POST',headers:{'Content-Type':'application/json','x-access-token':token},body:JSON.stringify({decision:d})});
    const t=document.createElement('div');
    if(res.ok) t.textContent=d==='approve'?'已通过，继续执行':'已拒绝';
    else { const data=await res.json().catch(()=>({})); t.textContent='审批失败：'+(data.detail||res.status); }
    card.appendChild(t); window.scrollTo(0,document.body.scrollHeight); };
  ok.onclick=()=>decide('approve'); no.onclick=()=>decide('deny');
  card.appendChild(ok); card.appendChild(no);
  log.appendChild(card); window.scrollTo(0,document.body.scrollHeight);
}
// v0.3 会话恢复：启动时按 localStorage 里的 session_id 拉最近 N 轮，
// 重建气泡与 history；会话不存在（404）就清掉旧 id、从新会话开始。
async function restore(){
  if(!sessionId) return;
  const token = localStorage.getItem('access_token')||'';
  const res = await fetch('/api/sessions/'+encodeURIComponent(sessionId)+'/messages',{headers:{'x-access-token':token}});
  if(res.status===404){ sessionId=''; localStorage.removeItem('session_id'); return; }
  if(!res.ok) return; // 401 等情况先跳过，下次发送时再鉴权
  const data = await res.json();
  history = data.messages || [];
  for(const m of history) add(m.content, m.role==='user' ? 'user' : '');
}
restore();
async function send(){
  const text = input.value.trim(); if(!text) return; input.value='';
  add(text,'user');
  let token = localStorage.getItem('access_token')||'';
  const body = ()=>JSON.stringify({message:text, history, session_id: sessionId || undefined});
  let res = await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json','x-access-token':token},body:body()});
  if(res.status===401){ token = prompt('服务器设置了 ACCESS_TOKEN，请输入：')||''; localStorage.setItem('access_token',token);
    res = await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json','x-access-token':token},body:body()}); }
  // 注意：启动时若因 401 跳过了会话恢复，本轮只保证服务端上下文正确
  // （session_id 已带上），旧气泡下次刷新（token 已存好）再恢复。
  if(!res.ok){ const data = await res.json().catch(()=>({})); add('出错：'+(data.detail||res.status),''); return; }
  // 流式消费：token 事件逐字追加到当前气泡，tool 事件实时插日志，done 收尾。
  // 气泡在第一个 token 到达时才创建，这样工具日志自然排在最终回复前面。
  let bubble = null;
  const ensureBubble = ()=>{ if(!bubble){ bubble = document.createElement('div'); bubble.className='msg'; log.appendChild(bubble); } return bubble; };
  let reply = '';
  const reader = res.body.getReader(), decoder = new TextDecoder(); let buf = '';
  const handle = ev=>{
    if(ev.type==='session'){ sessionId = ev.session_id; localStorage.setItem('session_id', sessionId); }
    else if(ev.type==='token'){ reply += ev.text; ensureBubble().textContent = reply; window.scrollTo(0,document.body.scrollHeight); }
    else if(ev.type==='tool'){ add('🔧 '+ev.tool+' '+JSON.stringify(ev.args),'tool'); }
    else if(ev.type==='tool_result'){ add('↳ '+ev.tool+'：'+ev.result.slice(0,200),'tool'); }
    else if(ev.type==='approval_required'){ showApproval(ev); }
    else if(ev.type==='error'){ add('出错：'+ev.detail,''); }
    else if(ev.type==='done'){ reply = ev.reply; ensureBubble().textContent = reply; if(ev.session_id){ sessionId = ev.session_id; localStorage.setItem('session_id', sessionId); } history.push({role:'user',content:text},{role:'assistant',content:reply}); }
  };
  while(true){
    const {done, value} = await reader.read(); if(done) break;
    buf += decoder.decode(value, {stream:true});
    let idx;
    while((idx = buf.indexOf('\n\n')) >= 0){
      const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for(const line of chunk.split('\n')) if(line.startsWith('data:')) handle(JSON.parse(line.slice(5)));
    }
  }
}
document.getElementById('send').onclick = send;
input.onkeydown = e=>{ if(e.key==='Enter') send(); };
</script>
</body>
</html>

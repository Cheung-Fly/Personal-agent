name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Compile check
        run: python -m py_compile backend/main.py backend/tools.py
      - name: Run tool-layer tests (no LLM required)
        run: python -m pytest tests/ -q

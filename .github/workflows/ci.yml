name: CI

on:
  push:
    braanches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version:"3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements
          pip install pytest
      - name: Compile check
        run: Python -m py_compile bac
      - name: Run tool-layer tests (n
        run: python -m pytest tests/
